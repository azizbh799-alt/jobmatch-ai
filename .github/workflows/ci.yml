name: CI

on:
  push:
  pull_request:

jobs:
  test-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: bandit -r app -ll
      - run: pytest -q

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: docker build -t jobmatch-ai:ci .

      - name: Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: jobmatch-ai:ci
          format: table
          exit-code: "1"
          severity: "CRITICAL,HIGH"
