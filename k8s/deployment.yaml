apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobmatch-api
  namespace: jobmatch
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jobmatch-api
  template:
    metadata:
      labels:
        app: jobmatch-api
    spec:
      containers:
        - name: api
          image: YOUR_AWS_ACCOUNT.dkr.ecr.YOUR_REGION.amazonaws.com/jobmatch-ai:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: jobmatch-secret
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: jobmatch-api
  namespace: jobmatch
spec:
  selector:
    app: jobmatch-api
  ports:
    - port: 80
      targetPort: 8000
  type: LoadBalancer
